<svg
  width="1000"
  height="100"
  viewBox="0 0 1000 100"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Professional headline"
>
  <defs>
    <!-- Mask untuk membentuk area teks -->
    <mask id="text-mask">
      <rect width="100%" height="100%" fill="black" />
      <text
        x="500"
        y="34"
        text-anchor="middle"
        fill="white"
        font-family="Trebuchet MS, Verdana, Arial, sans-serif"
        font-size="19"
        font-weight="500"
      >
        AI &amp; Machine Learning Enthusiast | Coding Camp 2025 Graduate
      </text>

      <text
        x="500"
        y="63"
        text-anchor="middle"
        fill="white"
        font-family="Trebuchet MS, Verdana, Arial, sans-serif"
        font-size="19"
        font-weight="500"
      >
        (DBS Foundation &amp; Dicoding Indonesia) | ITS Certified in Data Analytics (Certiport)
      </text>

      <text
        x="500"
        y="92"
        text-anchor="middle"
        fill="white"
        font-family="Trebuchet MS, Verdana, Arial, sans-serif"
        font-size="19"
        font-weight="500"
      >
        Informatics Engineering Student - Institut Teknologi Garut
      </text>
    </mask>

    <!-- Gradient untuk efek cahaya putih -->
    <linearGradient id="shine-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="35%" stop-color="white" stop-opacity="0" />
      <stop offset="50%" stop-color="white" stop-opacity="0.95" />
      <stop offset="65%" stop-color="white" stop-opacity="0" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Teks dasar ungu -->
  <text
    x="500"
    y="34"
    text-anchor="middle"
    fill="#A855F7"
    font-family="Trebuchet MS, Verdana, Arial, sans-serif"
    font-size="19"
    font-weight="500"
  >
    AI &amp; Machine Learning Enthusiast | Coding Camp 2025 Graduate
  </text>

  <text
    x="500"
    y="63"
    text-anchor="middle"
    fill="#A855F7"
    font-family="Trebuchet MS, Verdana, Arial, sans-serif"
    font-size="19"
    font-weight="500"
  >
    (DBS Foundation &amp; Dicoding Indonesia) | ITS Certified in Data Analytics (Certiport)
  </text>

  <text
    x="500"
    y="92"
    text-anchor="middle"
    fill="#A855F7"
    font-family="Trebuchet MS, Verdana, Arial, sans-serif"
    font-size="19"
    font-weight="500"
  >
    Informatics Engineering Student - Institut Teknologi Garut
  </text>

  <!-- Cahaya putih melintas -->
  <g mask="url(#text-mask)">
    <rect x="-250" y="0" width="250" height="100" fill="url(#shine-gradient)">
      <animate
        attributeName="x"
        from="-250"
        to="1000"
        dur="3.5s"
        repeatCount="indefinite"
      />
    </rect>
  </g>
</svg>
