name: Update GitHub Streak

on:
  workflow_dispatch:

  schedule:
    # 17:10 UTC = 00:10 WIB
    - cron: "10 17 * * *"

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: >-
            user=Rinarsm
            &theme=dark
            &timezone=Asia/Jakarta
            &hide_border=false
            &border=6D28D9
            &background=0D1117
            &ring=A855F7
            &fire=C084FC
            &currStreakLabel=C084FC
            &currStreakNum=FFFFFF
            &sideNums=FFFFFF
            &sideLabels=A855F7
            &dates=9CA3AF
            &card_width=495
            &card_height=195
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit Updated Streak
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/streak.svg

          if git diff --staged --quiet; then
            echo "No streak changes detected."
          else
            git commit -m "Update GitHub streak"
            git push
          fi
